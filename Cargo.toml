[package]
name = "stm32-bootloader"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "boot"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
arrayvec = { version = "0.7.6", default-features = false }
bytemuck = "1.25.0"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.1.0", optional = true }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.5.0", features = ["{{ chip-hal-name }}", "time", "time-driver-tim1"] }
embassy-time = { version = "0.5.0", features = ["generic-queue-8"] }

[features]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "embassy-futures/defmt",
    "embassy-stm32/defmt",
    "embassy-time/defmt"
]
hse = []
can = []
can2 = []

[profile.dev]
opt-level = "z"
lto = true

[profile.release]
opt-level = "z"
lto = true
