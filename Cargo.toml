[package]
name = "stm32-bootloader"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "boot"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.1.0", optional = true }
embassy-stm32 = { version = "0.5.0", features = ["{{ chip-hal-name }}"], default-features = false }

[features]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "embassy-stm32/defmt"
]
hse = []

[profile.dev]
opt-level = "z"
lto = true

[profile.release]
opt-level = "z"
lto = true
